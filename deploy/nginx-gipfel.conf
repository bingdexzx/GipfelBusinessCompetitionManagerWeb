# nginx 虚拟主机：Gipfel Business Competition Manager
#
# 部署：
#   1) 将本文件放到 /etc/nginx/sites-available/gipfel.conf
#   2) ln -s ../sites-available/gipfel.conf /etc/nginx/sites-enabled/
#   3) nginx -t && systemctl reload nginx
#   4) （可选）certbot --nginx -d comp.example.com

upstream gipfel_django {
    # Django daphne 本地监听 127.0.0.1:8000
    server 127.0.0.1:8000 fail_timeout=3s max_fails=3;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # 客户端 body 上限：支持模型导入 JSON、文件上传、股票批量下单
    client_max_body_size 128m;
    client_body_timeout 60s;
    send_timeout 60s;

    # 静态资源：前端 build 产物
    root __INSTALL_DIR__/frontend-dist;
    index index.html;

    # 日志
    access_log /var/log/nginx/gipfel.access.log;
    error_log  /var/log/nginx/gipfel.error.log warn;

    # ------------------------------
    # Django 后端 API
    # ------------------------------
    location /api/ {
        proxy_pass         http://gipfel_django;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;
    }

    # ------------------------------
    # Socket.IO：必须是 /socket.io/ 前缀 + Upgrade 头正确转发
    # ------------------------------
    location /socket.io/ {
        proxy_pass         http://gipfel_django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  86400s;   # 长连接，允许整日不断
        proxy_send_timeout  86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ------------------------------
    # 用户上传的文件 /uploads/* → backend/uploads
    # ------------------------------
    location /uploads/ {
        alias __INSTALL_DIR__/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # ------------------------------
    # 健康检查 /api/health 直接透传
    # ------------------------------
    location = /api/health {
        access_log off;
        proxy_pass         http://gipfel_django;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    # ------------------------------
    # SPA 兜底：前端 router 的 history 模式，所有非 API/非静态路由返回 index.html
    #           注意此段放在 API / socket.io / uploads 之后，避免吞掉真实 404
    # ------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问以点开头的隐藏文件
    location ~ /\. { deny all; access_log off; log_not_found off; }
}
