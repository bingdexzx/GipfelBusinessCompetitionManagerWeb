# nginx 虚拟主机：Gipfel Business Competition Manager
#
# 部署：
#   1) 将本文件放到 /etc/nginx/sites-available/gipfel.conf
#   2) ln -s ../sites-available/gipfel.conf /etc/nginx/sites-enabled/
#   3) nginx -t && systemctl reload nginx
#   4) （可选）certbot --nginx -d comp.example.com

upstream gipfel_django {
    # Django daphne 本地监听 127.0.0.1:8000
    server 127.0.0.1:8000 fail_timeout=3s max_fails=3;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # 客户端 body 上限：支持模型导入 JSON、文件上传、股票批量下单
    client_max_body_size 128m;
    client_body_timeout 60s;
    send_timeout 60s;

    # 静态资源：前端 build 产物
    root __INSTALL_DIR__/frontend-dist;
    index index.html;

    # 日志
    access_log /var/log/nginx/gipfel.access.log;
    error_log  /var/log/nginx/gipfel.error.log warn;

    # ------------------------------
    # Django 后端 API
    # ------------------------------
    location /api/ {
        proxy_pass         http://gipfel_django;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;
    }

    # ------------------------------
    # Socket.IO：必须是 /socket.io/ 前缀 + Upgrade 头正确转发
    # ------------------------------
    location /socket.io/ {
        proxy_pass         http://gipfel_django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  86400s;   # 长连接，允许整日不断
        proxy_send_timeout  86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ------------------------------
    # 用户上传的文件 /uploads/* → backend/uploads
    # ------------------------------
    location /uploads/ {
        alias __INSTALL_DIR__/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # ------------------------------
    # 健康检查 /api/health 直接透传
    # ------------------------------
    location = /api/health {
        access_log off;
        proxy_pass         http://gipfel_django;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    # ------------------------------
    # 静态资源（collectstatic 产物）：Django admin 等
    # ------------------------------
    location /static/ {
        alias __INSTALL_DIR__/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ------------------------------
    # SPA 兜底：前端 router 的 history 模式，所有非 API/非静态路由返回 index.html
    #           注意此段放在 API / socket.io / uploads / static 之后，避免吞掉真实 404
    # ------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问以点开头的隐藏文件
    location ~ /\. { deny all; access_log off; log_not_found off; }
}

# ============================================================
# 日志查看器（独立 Django 站点）：整站代理到 127.0.0.1:8120
# ------------------------------------------------------------
# 为什么是独立子域 + 整站代理：
#   - 日志查看器 STATIC_URL 为 /static/，nginx 不能用「带前缀的路径代理」，
#     否则 /static/ 资源会被错误改写；必须整站（/）代理。
#   - 用 log.<DOMAIN> 子域与主站点隔离 cookie 命名空间，避免冲突。
# 前置条件（运维侧）：
#   - DNS：log.<DOMAIN> 的 A 记录指向本服务器；
#   - 证书：certbot 需覆盖该子域（见 deploy-linux.sh 的 certbot 命令，已纳入 -d log.<DOMAIN>）。
#     未启用 HTTPS 时本块以 HTTP(80) 提供服务，cookie 非 Secure，功能正常。
# 防直连：直接访问本子域根路径会被日志查看器 403 拒绝；
#   仅前端「系统设置 → 日志查看器」按钮携带一次性令牌跳转方可进入。
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name log.__DOMAIN__;

    client_max_body_size 16m;

    access_log /var/log/nginx/gipfel-logviewer.access.log;
    error_log  /var/log/nginx/gipfel-logviewer.error.log warn;

    # 静态资源（collectstatic 产物）：nginx 直接托管，避免依赖 Django 生产服务静态
    location /static/ {
        alias __INSTALL_DIR__/backend/logviewer/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 整站代理到日志查看器（daphne @ 127.0.0.1:8120）
    location / {
        proxy_pass         http://127.0.0.1:8120;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;
    }

    location ~ /\. { deny all; access_log off; log_not_found off; }
}
