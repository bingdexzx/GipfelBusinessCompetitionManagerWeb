# Nginx 优化配置 - 适用于 200-500 并发
# 文件位置: /etc/nginx/sites-available/gipfel

upstream daphne_backend {
    # 最少连接策略，适合长连接场景
    least_conn;
    
    # 4 个 Daphne worker
    server 127.0.0.1:8000 weight=1 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8001 weight=1 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8002 weight=1 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8003 weight=1 max_fails=3 fail_timeout=30s;
    
    # 长连接复用
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# 限流配置（防止恶意请求）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name your-domain.com;
    
    # ========== 连接优化 ==========
    client_max_body_size 50m;
    client_body_timeout 60s;
    client_header_timeout 30s;
    keepalive_timeout 75s;
    send_timeout 60s;
    
    # 代理超时
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    
    # 代理缓冲
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 256k;
    
    # ========== Gzip 压缩 ==========
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;
    
    # ========== 静态文件缓存 ==========
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://daphne_backend;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # ========== Socket.IO 长连接 ==========
    location /socket.io/ {
        proxy_pass http://daphne_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 长连接超时（24小时）
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    
    # ========== API 接口 ==========
    location /api/ {
        # 限流：每秒30个请求，突发50个
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 100;
        
        proxy_pass http://daphne_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # ========== 默认路由 ==========
    location / {
        proxy_pass http://daphne_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # ========== 错误页面 ==========
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}